; 博客后端配置
; 注意：本文件包含密钥，已在 .gitignore 中排除，请勿提交到版本库。
; 参考模板见 config.example.ini。

[app]
title = SuiLi 的博客
host = 127.0.0.1
port = 8000
debug = false
; 允许跨域的前端来源，逗号分隔
cors_origins = http://localhost:5173,http://127.0.0.1:5173,http://www.swayrift.top

[database]
; 相对 backend/ 目录
sqlite_path = data/blog.db

[faiss]
; FAISS 索引和清单路径（相对 backend/ 目录）
index_path = data/faiss/index.faiss
manifest_path = data/faiss/manifest.json
; BAAI/bge-m3 输出维度
embedding_dim = 1024

[content]
; 相对 backend/ 目录
posts_dir = ../content/posts
documents_dir = ../content/documents
about_file = ../content/about.md

[import]
; 语义分块：chunk 最大字符数与相邻句子相似度突降阈值
chunk_size = 500
similarity_drop = 0.15
; 硅基流动免费档有速率限制，批量向量化时的批大小与批间隔（秒）
embedding_batch_size = 16
batch_sleep = 0.5

[retrieval]
; 向量召回数量与重排保留数量
top_k = 80
rerank_top_n = 8
; 重排置信度低于此值的片段不会进入提示词或返回 sources
min_score = 0.3

[qa_cache]
; 问答缓存：命中阈值（余弦相似度）、缓存有效期（秒）
similarity_threshold = 0.85
cache_ttl = 604800

[siliconflow]
; api_key = 
base_url = https://api.siliconflow.cn
embedding_model = BAAI/bge-m3
reranker_model = BAAI/bge-reranker-v2-m3
timeout = 60

[openai]
; 用于查询改写与答案生成；留空时问答只返回检索片段
; api_key = 
; base_url = 
model = gpt-5.6-luna
temperature = 0.3
