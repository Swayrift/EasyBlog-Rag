; 博客后端配置模板
; 复制为 config.ini 后填写真实密钥。config.ini 已被 .gitignore 排除。

[app]
title = 个人博客
host = 127.0.0.1
port = 8000
debug = false
cors_origins = http://localhost:5173,http://127.0.0.1:5173

[database]
sqlite_path = data/blog.db

[milvus]
db_path = data/milvus.db
collection = blog_chunks
embedding_dim = 1024

[content]
posts_dir = ../content/posts
documents_dir = ../content/documents
about_file = ../content/about.md

[import]
; 语义分块：chunk 最小/最大字符数与相邻句子相似度突降阈值
chunk_size = 600
similarity_drop = 0.15
embedding_batch_size = 16
batch_sleep = 0.5

[retrieval]
top_k = 10
rerank_top_n = 4

[siliconflow]
api_key = <SILICONFLOW_API_KEY>
base_url = https://api.siliconflow.cn
embedding_model = BAAI/bge-m3
reranker_model = BAAI/bge-reranker-v2-m3
timeout = 60

[openai]
api_key = <OPENAI_API_KEY>
base_url = https://api.openai.com/v1
model = gpt-4o-mini
temperature = 0.3
